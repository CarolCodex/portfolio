name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  VITE_BASE_PATH: /portfolio/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build
        run: npm run build

      - name: Verify GitHub Pages output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -d dist/assets
          grep -Eq 'src="/portfolio/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/portfolio/assets/[^"]+\.css"' dist/index.html
          grep -Fq 'const base = "/portfolio/"' dist/404.html
          grep -Fq 'window.location.replace' dist/404.html
          grep -Fq 'Sitemap:' dist/robots.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to gh-pages
        id: deployment
        uses: actions/deploy-pages@v4
